
cargo-features = ["profile-rustflags"]

[package]
name = "sample-manager"
version = "0.1.0"
edition = "2024"

[workspace]
resolver = "3"
members = ["crates/bx-*"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }

[lib]
crate-type = ["cdylib", "rlib"]

# not `sample-manager`: a bin and a lib of the same name collide on `sample_manager.pdb`
[[bin]]
name = "sample-manager-standalone"
path = "src/main.rs"
required-features = ["standalone"]

[features]
default = ["standalone"]
standalone = []
plugin = [
  "dep:clack-plugin",
  "dep:clack-extensions",
  "dep:postcard",
  "dep:serde",
]

[dependencies]
bx_shader = { path = "./crates/bx-shader" }
bx_shell = { path = "./crates/bx-shell" }
bx_svg = { path = "./crates/bx-svg" }
bx_ui = { path = "./crates/bx-ui" }
dirs = "6"
fuzzy-matcher = "0.3"
rayon = "1"
clack-plugin = { version = "0.2", optional = true }
clack-extensions = { version = "0.2", features = [
  "clack-plugin",
  "gui",
  "timer",
  "state",
], optional = true }
postcard = { version = "1", features = ["use-std"], optional = true }
serde = { workspace = true, optional = true }

[build-dependencies]
bx_shader = { path = "./crates/bx-shader", features = ["build"] }

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
panic = "abort"
strip = true
debug = false
overflow-checks = false
trim-paths = "all"
rustflags = ["-Cdebuginfo=0", "-Zthreads=8"]
