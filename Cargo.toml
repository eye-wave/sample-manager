cargo-features = ["profile-rustflags"]

[workspace]
resolver = "3"
members = ["crates/bx-*", "plugins/*"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
# no panic = "abort": the renderer unwraps Vulkan errors and relies on unwinding to die alone
strip = true
debug = false
overflow-checks = false
trim-paths = "all"
rustflags = ["-Cdebuginfo=0", "-Zthreads=8"]
