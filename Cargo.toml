
cargo-features = ["profile-rustflags"]

[package]
name = "sample-manager"
version = "0.1.0"
edition = "2024"

[workspace]
resolver = "3"
members = ["shell", "shell/tools/msdf", "icon_macro"]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "sample-manager"
required-features = ["standalone"]

[features]
default = ["standalone"]
standalone = []
plugin = ["dep:clack-plugin", "dep:clack-extensions", "dep:postcard", "dep:serde"]

[dependencies]
shell = { path = "./shell" }
icon_macro = { path = "./icon_macro" }
clack-plugin = { version = "0.2", optional = true }
clack-extensions = { version = "0.2", features = [
  "clack-plugin",
  "gui",
  "timer",
  "state",
], optional = true }
postcard = { version = "1", features = ["use-std"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
panic = "abort"
strip = true
debug = false
overflow-checks = false
trim-paths = "all"
rustflags = ["-Cdebuginfo=0", "-Zthreads=8"]
