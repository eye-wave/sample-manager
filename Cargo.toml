
cargo-features = ["profile-rustflags"]

[package]
name = "sample-manager"
version = "0.1.0"
edition = "2024"

[workspace]
resolver = "3"
members = ["lucide_macro"]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "sample-manager"
required-features = ["standalone"]

[features]
default = ["standalone"]
standalone = ["dep:x11", "dep:windows-sys"]
plugin = [
  "dep:clack-plugin",
  "dep:clack-extensions",
  "dep:x11",
  "dep:windows-sys",
]

[dependencies]
ash = "0.38"
lucide_macro = { path = "./lucide_macro" }
clack-plugin = { version = "0.2", optional = true }
clack-extensions = { version = "0.2", features = [
  "clack-plugin",
  "gui",
  "timer",
], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = ">=0.59, <=0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
], optional = true }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
x11 = { version = "2", features = ["xlib"], optional = true }

[build-dependencies]
naga = { version = "30", features = ["wgsl-in", "spv-out"] }

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
panic = "abort"
strip = true
debug = false
overflow-checks = false
trim-paths = "all"
rustflags = ["-Cdebuginfo=0", "-Zthreads=8"]
