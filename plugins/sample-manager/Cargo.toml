
[package]
name = "sample-manager"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "sample-manager-standalone"
path = "src/main.rs"
required-features = ["standalone"]

[features]
default = ["standalone"]
standalone = ["dep:cpal"]
plugin = [
  "dep:clack-plugin",
  "dep:clack-extensions",
  "dep:postcard",
  "dep:serde",
]

[dependencies]
bx_app = { path = "../../crates/bx-app" }
bx_shader = { path = "../../crates/bx-shader" }
clack-extensions = { version = "0.2", features = [
  "clack-plugin",
  "audio-ports",
  "gui",
  "timer",
  "state",
], optional = true }
clack-plugin = { version = "0.2", optional = true }
cpal = { version = "0.18", optional = true }
dirs = "7"
fuzzy-matcher = "0.3"
postcard = { version = "1", features = ["use-std"], optional = true }
rayon = "1"
reqwest = { version = "0.13", default-features = false, features = [
  "blocking",
  "rustls",
] }
serde = { workspace = true, optional = true }
static-toml = "1.3.0"
symphonia = { version = "0.6", default-features = false, features = [
  "wav",
  "pcm",
  "mp1",
  "mp2",
  "mp3",
  "id3v1",
  "id3v2",
  "ape",
  "flac",
  "ogg",
  "vorbis",
] }
wasmtime = { version = "49", default-features = false, features = [
  "cranelift",
  "component-model",
  "runtime",
  "std",
] }
wasmtime-wasi = "49"

[build-dependencies]
bx_shader = { path = "../../crates/bx-shader", features = ["build"] }

[dev-dependencies]
wat = "1"
wit-component = "0.262"
wit-parser = "0.262"
