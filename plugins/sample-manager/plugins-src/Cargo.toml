
cargo-features = ["profile-rustflags", "panic-immediate-abort"]

[workspace]
resolver = "3"
members = ["splice", "bx-plugin"]

[workspace.dependencies]
bx-plugin = { path = "bx-plugin" }
serde_json = "1"
wit-bindgen = "0.63"

[profile.release]
opt-level = "s"
codegen-units = 1
lto = "fat"
panic = "immediate-abort"
strip = true
debug = false
overflow-checks = false
trim-paths = "all"
rustflags = ["-Cdebuginfo=0", "-Zthreads=8"]
